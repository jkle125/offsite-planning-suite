<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offsite Planning Suite</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff;color:#1a1a1a;padding:2rem;max-width:800px;margin:0 auto}
.app{padding:0}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem}
.wordmark{font-size:15px;font-weight:500;letter-spacing:-0.02em}
.wordmark span{color:#888;font-weight:400}
.topbar-right{display:flex;gap:8px}
.icon-btn{display:flex;align-items:center;gap:5px;font-size:12px;padding:5px 10px;border-radius:8px;border:0.5px solid #ccc;background:#fff;color:#888;cursor:pointer}
.icon-btn:hover{background:#f5f5f5;color:#1a1a1a}
.tabs{display:flex;gap:0;margin-bottom:1.5rem;border-bottom:0.5px solid #e5e5e5}
.tab{font-size:12px;font-weight:500;padding:7px 14px;cursor:pointer;color:#888;border-bottom:2px solid transparent;margin-bottom:-0.5px;white-space:nowrap}
.tab.active{color:#1a1a1a;border-bottom:2px solid #1a1a1a}
.panel{display:none}.panel.active{display:block}
.progress-wrap{background:#f7f7f5;border-radius:8px;padding:10px 14px;margin-bottom:1.5rem;display:flex;align-items:center;gap:12px}
.progress-label{font-size:12px;color:#888;white-space:nowrap}
.progress-bar-wrap{flex:1;background:#e5e5e5;border-radius:999px;height:6px}
.progress-bar{height:6px;border-radius:999px;background:#1D9E75;transition:width 0.3s}
.progress-pct{font-size:12px;font-weight:500;color:#1a1a1a;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:1.25rem}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11px;font-weight:500;color:#888;text-transform:uppercase;letter-spacing:0.04em}
.field input,.field select{font-size:13px;padding:6px 8px;border:0.5px solid #ddd;border-radius:8px;background:#fff;color:#1a1a1a}
.run{width:100%;padding:9px;font-size:13px;font-weight:500;border-radius:8px;border:0.5px solid #ccc;background:#fff;color:#1a1a1a;cursor:pointer;margin-bottom:1.5rem}
.run:hover{background:#f5f5f5}
.sec{font-size:11px;font-weight:500;color:#888;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px;margin-top:1.25rem}
.sec:first-of-type{margin-top:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1.5rem}
.stat{background:#f7f7f5;border-radius:8px;padding:12px 14px}
.sl{font-size:11px;color:#888;margin-bottom:4px}
.sv{font-size:18px;font-weight:500;color:#1a1a1a}
.ss{font-size:11px;color:#888;margin-top:2px}
.task-group{margin-bottom:1rem}
.tg-head{font-size:12px;font-weight:500;color:#1a1a1a;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.tg-badge{font-size:11px;padding:1px 7px;border-radius:999px;font-weight:500}
.b-red{background:#FCEBEB;color:#791F1F}
.b-amber{background:#FAEEDA;color:#633806}
.b-blue{background:#E6F1FB;color:#0C447C}
.b-green{background:#EAF3DE;color:#27500A}
.task{display:flex;align-items:flex-start;gap:8px;padding:7px 10px;background:#fff;border:0.5px solid #e5e5e5;border-radius:8px;margin-bottom:4px;transition:opacity 0.2s}
.task.done{opacity:0.5}
.task-check{width:15px;height:15px;border-radius:3px;flex-shrink:0;margin-top:1px;cursor:pointer;accent-color:#1D9E75}
.task-txt{font-size:12px;color:#1a1a1a;line-height:1.5}
.task-sub{font-size:11px;color:#888;margin-top:1px}
.div{height:0.5px;background:#e5e5e5;margin:1.25rem 0}
.budget-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bcat{font-size:12px;color:#1a1a1a;width:160px;flex-shrink:0}
.bbar-wrap{flex:1;background:#f7f7f5;border-radius:999px;height:8px;overflow:hidden}
.bbar-est{height:8px;border-radius:999px;background:#B5D4F4}
.bamt-wrap{display:flex;flex-direction:column;align-items:flex-end;width:100px;flex-shrink:0}
.bamt-est{font-size:11px;color:#888}
.bamt-act-wrap{display:flex;align-items:center;gap:4px}
.bamt-act{font-size:12px;font-weight:500;color:#1a1a1a;width:70px;border:none;background:transparent;text-align:right;padding:2px 0;border-bottom:0.5px solid #ddd}
.bamt-act:focus{outline:none;border-bottom-color:#1a1a1a}
.total-row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#f7f7f5;border-radius:8px;margin-top:8px}
.total-label{font-size:13px;font-weight:500;color:#1a1a1a}
.total-val{font-size:15px;font-weight:500;color:#1a1a1a}
.vendor-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:10px;margin-bottom:1.5rem}
.vcard{background:#fff;border:0.5px solid #e5e5e5;border-radius:12px;padding:12px 14px}
.vcard.best{border:2px solid #378ADD}
.vname{font-size:13px;font-weight:500;color:#1a1a1a;margin-bottom:4px}
.vtag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:999px;background:#E6F1FB;color:#0C447C;font-weight:500;margin-bottom:6px}
.vdetails{font-size:12px;color:#888;line-height:1.6;margin-bottom:8px}
.vrating{display:flex;gap:3px;margin-bottom:8px}
.vdot{width:7px;height:7px;border-radius:50%;background:#e5e5e5}
.vdot.on{background:#378ADD}
.quote-btn{width:100%;padding:5px;font-size:11px;font-weight:500;border-radius:8px;border:0.5px solid #ddd;background:#f7f7f5;color:#1a1a1a;cursor:pointer}
.roi-result{background:#f7f7f5;border-radius:12px;padding:1.25rem;margin-top:1rem}
.roi-big{font-size:32px;font-weight:500;color:#0F6E56;margin:8px 0 4px}
.roi-sub{font-size:13px;color:#888;margin-bottom:1rem}
.roi-rows{display:flex;flex-direction:column;gap:6px}
.roi-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:0.5px solid #e5e5e5}
.roi-row:last-child{border-bottom:none;font-weight:500}
.roi-pos{color:#0F6E56}
.roi-neg{color:#791F1F}
.survey-q{background:#fff;border:0.5px solid #e5e5e5;border-radius:8px;padding:10px 14px;margin-bottom:6px}
.survey-q-text{font-size:13px;color:#1a1a1a;margin-bottom:4px}
.survey-q-type{font-size:11px;color:#888}
.out{display:none}
.share-bar{background:#f7f7f5;border-radius:8px;padding:10px 14px;display:flex;align-items:center;gap:10px;margin-bottom:1rem}
.share-url{flex:1;font-size:12px;color:#888;font-family:monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.copy-btn{font-size:11px;padding:4px 10px;border-radius:8px;border:0.5px solid #ddd;background:#fff;color:#1a1a1a;cursor:pointer;white-space:nowrap}
</style>
</head>
<body>
<div class="app">
<div class="topbar">
  <div class="wordmark">Offsite <span>/ Planning suite</span></div>
  <div class="topbar-right">
    <button class="icon-btn" onclick="sharePlan()"><i class="ti ti-share"></i> Share plan</button>
    <button class="icon-btn" onclick="exportPlan()"><i class="ti ti-download"></i> Export PDF</button>
  </div>
</div>
<div class="tabs">
  <div class="tab active" onclick="switchTab('timeline',this)">Timeline</div>
  <div class="tab" onclick="switchTab('budget',this)">Budget tracker</div>
  <div class="tab" onclick="switchTab('vendors',this)">Vendors</div>
  <div class="tab" onclick="switchTab('roi',this)">ROI calculator</div>
  <div class="tab" onclick="switchTab('survey',this)">Survey builder</div>
</div>
<div class="panel active" id="timeline">
  <div class="progress-wrap" id="progress-wrap" style="display:none">
    <span class="progress-label">Planning progress</span>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progress-bar" style="width:0%"></div></div>
    <span class="progress-pct" id="progress-pct">0%</span>
  </div>
  <div class="grid">
    <div class="field"><label>Headcount</label><select id="t-size"><option value="small">Small (10-25)</option><option value="mid" selected>Mid (25-75)</option><option value="large">Large (75-150)</option><option value="xl">XL (150+)</option></select></div>
    <div class="field"><label>Duration</label><select id="t-dur"><option value="day">Day trip</option><option value="overnight" selected>Overnight</option><option value="multi">Multi-day</option></select></div>
    <div class="field"><label>Lead time</label><select id="t-lead"><option value="rush">Rush (under 4 wks)</option><option value="standard" selected>Standard (4-12 wks)</option><option value="advance">Advance (12+ wks)</option></select></div>
    <div class="field"><label>Location</label><select id="t-loc"><option value="local">Local (driving)</option><option value="domestic" selected>Domestic (flight)</option><option value="international">International</option></select></div>
  </div>
  <button class="run" onclick="genTimeline()">Generate planning timeline</button>
  <div class="out" id="t-out"></div>
</div>
<div class="panel" id="budget">
  <div class="grid">
    <div class="field"><label>Total budget ($)</label><input type="number" id="b-total" value="50000"></div>
    <div class="field"><label>Headcount</label><input type="number" id="b-heads" value="50"></div>
    <div class="field"><label>Trip type</label><select id="b-type"><option value="day">Day trip</option><option value="overnight" selected>Overnight</option><option value="multi">Multi-day</option></select></div>
    <div class="field"><label>Priority</label><select id="b-pri"><option value="experience">Experience-first</option><option value="balanced" selected>Balanced</option><option value="budget">Budget-conscious</option></select></div>
  </div>
  <button class="run" onclick="genBudget()">Build budget tracker</button>
  <div class="out" id="b-out"></div>
</div>
<div class="panel" id="vendors">
  <div class="grid">
    <div class="field"><label>Category</label><select id="v-cat"><option value="venue">Venue</option><option value="catering">Catering</option><option value="activities">Activities</option><option value="transport">Transportation</option><option value="av">AV & production</option></select></div>
    <div class="field"><label>Group size</label><select id="v-size"><option value="small">Small (under 25)</option><option value="mid" selected>Mid (25-75)</option><option value="large">Large (75+)</option></select></div>
    <div class="field"><label>Budget tier</label><select id="v-budget"><option value="value">Value</option><option value="mid" selected>Mid-range</option><option value="premium">Premium</option></select></div>
  </div>
  <button class="run" onclick="genVendors()">Compare vendor options</button>
  <div class="out" id="v-out"></div>
</div>
<div class="panel" id="roi">
  <div class="grid">
    <div class="field"><label>Team size</label><input type="number" id="r-heads" value="50"></div>
    <div class="field"><label>Avg annual salary ($)</label><input type="number" id="r-salary" value="90000"></div>
    <div class="field"><label>Offsite total cost ($)</label><input type="number" id="r-cost" value="50000"></div>
    <div class="field"><label>Days out of office</label><input type="number" id="r-days" value="2"></div>
  </div>
  <div class="grid">
    <div class="field"><label>Retention lift (%)</label><input type="number" id="r-retention" value="5"></div>
    <div class="field"><label>Replacement cost ($)</label><input type="number" id="r-replace" value="45000"></div>
    <div class="field"><label>Productivity gain (%)</label><input type="number" id="r-productivity" value="3"></div>
    <div class="field"><label>Industry</label><select id="r-industry"><option value="tech">Tech</option><option value="finance">Finance</option><option value="healthcare">Healthcare</option><option value="consulting">Consulting</option><option value="other">Other</option></select></div>
  </div>
  <button class="run" onclick="genROI()">Calculate ROI</button>
  <div class="out" id="r-out"></div>
</div>
<div class="panel" id="survey">
  <div class="grid">
    <div class="field"><label>Survey type</label><select id="s-type"><option value="post">Post-event feedback</option><option value="pre">Pre-event preferences</option><option value="planning">Planning input</option></select></div>
    <div class="field"><label>Team focus</label><select id="s-focus"><option value="general">General</option><option value="exec">Executive team</option><option value="eng">Engineering</option><option value="sales">Sales</option><option value="remote">Remote-first</option></select></div>
  </div>
  <button class="run" onclick="genSurvey()">Build survey</button>
  <div class="out" id="s-out"></div>
</div>
</div>
<script>
let checkStates={};
function switchTab(id,el){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));el.classList.add('active');document.getElementById(id).classList.add('active');}
function updateProgress(){const boxes=document.querySelectorAll('.task-check');if(!boxes.length)return;const done=[...boxes].filter(b=>b.checked).length;const pct=Math.round(done/boxes.length*100);document.getElementById('progress-bar').style.width=pct+'%';document.getElementById('progress-pct').textContent=pct+'%';document.getElementById('progress-wrap').style.display='flex';}
function toggleTask(id,cb){checkStates[id]=cb.checked;document.getElementById(id).classList.toggle('done',cb.checked);updateProgress();}
function genTimeline(){const size=document.getElementById('t-size').value;const dur=document.getElementById('t-dur').value;const lead=document.getElementById('t-lead').value;const loc=document.getElementById('t-loc').value;const fly=loc!=='local';const weeks={rush:'1-3',standard:'4-12',advance:'12-20'}[lead];const complexity={small:'Low',mid:'Medium',large:'High',xl:'Very high'}[size];const phases=[{label:'Immediate',badge:'b-red',name:'Week 1',tasks:[{t:'Define goals, budget, and success metrics',s:'Get leadership sign-off before any vendor outreach'},{t:'Confirm headcount and lock 2-3 date options',s:'Survey the team if needed'},{t:fly?'Begin flight search and hotel room block':'Identify venue shortlist',s:fly?'Group rates require 30+ days advance booking':'3-5 venues matched to budget and size'},{t:'Assign internal planning owner and day-of leads',s:'One person owns logistics, another owns agenda'}]},{label:'Planning',badge:'b-amber',name:'Weeks 2-4',tasks:[{t:'Send RFPs to shortlisted venues',s:'Include headcount, dates, AV needs, F&B minimums, room block requirements'},{t:'Book venue and send save-the-dates',s:'Collect dietary restrictions and accessibility needs'},{t:fly?'Finalize flights and ground transport':'Confirm transportation plan',s:'Assign single point of contact for travel questions'},{t:'Draft agenda and assign session owners',s:'Leave 20-30% unstructured'},{t:'Book activities and evening programming',s:'Popular experiences sell out — book early'}]},{label:'Execution',badge:'b-blue',name:'Weeks 5-8',tasks:[{t:'Confirm all vendor contracts and deposits',s:'Venue, catering, AV, activities, transportation'},{t:'Send detailed attendee communication',s:'Logistics, packing list, schedule, FAQs'},{t:'Build run-of-show with minute-by-minute owners',s:'Share with venue manager and all internal leads'},{t:'Confirm final headcount with all vendors',s:'Most venues need final count 72 hours out'}]},{label:'Day-of',badge:'b-green',name:'Event week',tasks:[{t:'Arrive 90 minutes before first attendee',s:'Walk space, confirm setup, test AV, brief staff'},{t:'Distribute run-of-show to all stakeholders',s:'Venue, catering, AV, internal owners'},{t:'Send post-event survey within 24 hours',s:'Capture feedback while fresh'},{t:'Reconcile actuals vs budget within 48 hours',s:'Document for future planning reference'}]}];let tid=0;const html=`<div class="stats"><div class="stat"><div class="sl">Lead time</div><div class="sv">${weeks} wks</div><div class="ss">${lead}</div></div><div class="stat"><div class="sl">Complexity</div><div class="sv">${complexity}</div><div class="ss">${size} group</div></div><div class="stat"><div class="sl">Flight required</div><div class="sv">${fly?'Yes':'No'}</div><div class="ss">${loc}</div></div><div class="stat"><div class="sl">Duration</div><div class="sv">${{day:'1 day',overnight:'2 days',multi:'3-5 days'}[dur]}</div><div class="ss">${dur}</div></div></div>${phases.map(p=>`<div class="task-group"><div class="tg-head"><span class="tg-badge ${p.badge}">${p.label}</span>${p.name}</div>${p.tasks.map(t=>{const id='task-'+tid++;return`<div class="task" id="${id}"><input type="checkbox" class="task-check" onchange="toggleTask('${id}',this)" ${checkStates[id]?'checked':''}><div><div class="task-txt">${t.t}</div><div class="task-sub">${t.s}</div></div></div>`;}).join('')}</div>`).join('')}`;const out=document.getElementById('t-out');out.innerHTML=html;out.style.display='block';updateProgress();}
function genBudget(){const total=parseInt(document.getElementById('b-total').value)||50000;const heads=parseInt(document.getElementById('b-heads').value)||50;const type=document.getElementById('b-type').value;const pri=document.getElementById('b-pri').value;const allocs={day:{experience:{venue:20,food:35,activities:30,transport:10,misc:5},balanced:{venue:25,food:35,activities:20,transport:15,misc:5},budget:{venue:30,food:40,activities:10,transport:15,misc:5}},overnight:{experience:{venue:35,food:25,activities:20,transport:12,misc:8},balanced:{venue:35,food:28,activities:15,transport:15,misc:7},budget:{venue:38,food:30,activities:10,transport:17,misc:5}},multi:{experience:{venue:40,food:25,activities:18,transport:12,misc:5},balanced:{venue:38,food:27,activities:15,transport:14,misc:6},budget:{venue:40,food:30,activities:8,transport:17,misc:5}}};const pcts=allocs[type][pri];const cats=['venue','food','activities','transport','misc'];const labels={venue:'Venue & accommodations',food:'Food & beverage',activities:'Activities & programming',transport:'Transportation',misc:'Contingency'};const rows=cats.map(c=>{const est=Math.round(total*pcts[c]/100);return`<div class="budget-row"><div class="bcat">${labels[c]}</div><div class="bbar-wrap"><div class="bbar-est" style="width:${pcts[c]}%"></div></div><div class="bamt-wrap"><div class="bamt-est">Est: $${est.toLocaleString()}</div><div class="bamt-act-wrap"><span style="font-size:11px;color:#888">Act:</span><input class="bamt-act" type="number" placeholder="$0" id="act-${c}" oninput="updateActuals(${total})"></div></div></div>`;}).join('');const html=`<div class="stats"><div class="stat"><div class="sl">Total budget</div><div class="sv">$${total.toLocaleString()}</div><div class="ss">${pri}</div></div><div class="stat"><div class="sl">Per person</div><div class="sv">$${Math.round(total/heads).toLocaleString()}</div><div class="ss">${heads} attendees</div></div><div class="stat"><div class="sl">Largest line</div><div class="sv">Venue</div><div class="ss">${pcts.venue}% of budget</div></div><div class="stat"><div class="sl">Actual spent</div><div class="sv" id="actual-total">$0</div><div class="ss" id="actual-status">enter actuals below</div></div></div><div class="sec">Budget vs actual</div>${rows}<div class="total-row"><span class="total-label">Total estimated</span><span class="total-val">$${total.toLocaleString()}</span></div>`;const out=document.getElementById('b-out');out.innerHTML=html;out.style.display='block';}
function updateActuals(total){const cats=['venue','food','activities','transport','misc'];let sum=0;cats.forEach(c=>{sum+=parseInt(document.getElementById('act-'+c)?.value)||0;});const el=document.getElementById('actual-total');const st=document.getElementById('actual-status');if(el){el.textContent='$'+sum.toLocaleString();const diff=sum-total;if(diff>0){el.style.color='#791F1F';st.textContent='$'+diff.toLocaleString()+' over';}else if(diff<0){el.style.color='#0F6E56';st.textContent='$'+Math.abs(diff).toLocaleString()+' remaining';}else{el.style.color='';st.textContent='on budget';}}}
function genVendors(){const cat=document.getElementById('v-cat').value;const size=document.getElementById('v-size').value;const budget=document.getElementById('v-budget').value;const V={venue:{small:{value:[{n:'Boutique hotel meeting room',tag:'Self-service',d:'Flexible F&B minimums, AV included',r:4},{n:'Co-working event space',tag:'Tech-friendly',d:'Modern aesthetic, built-in AV',r:3},{n:'Restaurant private room',tag:'Intimate',d:'Built-in catering, no room fee',r:3}],mid:[{n:'Conference center',tag:'Recommended',d:'Dedicated event staff, built-in AV, flexible layouts',r:5,best:true},{n:'Hotel ballroom',tag:'All-in-one',d:'Rooms + meeting + catering bundle',r:4},{n:'Historic venue',tag:'Memorable',d:'Unique aesthetic, strong F&B partner required',r:3}],premium:[{n:'Luxury resort',tag:'Premium',d:'Full-service, dedicated coordinator, premium F&B',r:5,best:true},{n:'Private estate',tag:'Exclusive',d:'High privacy, custom setup',r:4},{n:'5-star hotel',tag:'Turnkey',d:'White-glove service, premium AV',r:4}]},large:{value:[{n:'Convention center',tag:'High capacity',d:'Cost-effective per head at scale',r:3},{n:'University event space',tag:'Academic',d:'Large capacity, affordable',r:3},{n:'Warehouse event space',tag:'Flexible',d:'Open floor plan, good for large formats',r:4,best:true}],mid:[{n:'Hotel conference center',tag:'Recommended',d:'Room block + meeting space, streamlined billing',r:5,best:true},{n:'Resort conference facility',tag:'Full-service',d:'Outdoor options, F&B on-site',r:4},{n:'Corporate event venue',tag:'Purpose-built',d:'Built for large groups, reliable AV',r:4}],premium:[{n:'Destination resort',tag:'Flagship',d:'World-class amenities, full event team',r:5,best:true},{n:'Private island or estate',tag:'Ultra-exclusive',d:'Maximum privacy, complex logistics',r:4},{n:'Landmark venue',tag:'Iconic',d:'Strong brand statement, premium pricing',r:3}]}},catering:{small:{value:[{n:'Local restaurant catering',tag:'Local flavor',d:'Better quality, supports local bu function genROI(){const heads=parseInt(document.getElementById('r-heads').value)||50;const salary=parseInt(document.getElementById('r-salary').value)||90000;const cost=parseInt(document.getElementById('r-cost').value)||50000;const days=parseInt(document.getElementById('r-days').value)||2;const retention=parseInt(document.getElementById('r-retention').value)||5;const replace=parseInt(document.getElementById('r-replace').value)||45000;const productivity=parseInt(document.getElementById('r-productivity').value)||3;const dailyRate=salary/260;const timeAway=Math.round(heads*dailyRate*days);const retentionValue=Math.round(heads*(retention/100)*replace);const productivityValue=Math.round(heads*salary*(productivity/100));const totalReturn=retentionValue+productivityValue;const netROI=totalReturn-cost-timeAway;const roiPct=Math.round((netROI/(cost+timeAway))*100);const perHead=Math.round(cost/heads);const breakeven=Math.ceil(cost/replace);const html=`<div class="roi-result"><div style="font-size:12px;color:#888">Estimated net ROI</div><div class="roi-big" style="color:${netROI>=0?'#0F6E56':'#791F1F'}">$${Math.abs(netROI).toLocaleString()} ${netROI>=0?'gain':'loss'}</div><div class="roi-sub">${roiPct}% return on offsite investment</div><div class="roi-rows"><div class="roi-row"><span>Offsite total cost</span><span class="roi-neg">-$${cost.toLocaleString()}</span></div><div class="roi-row"><span>Productivity time away</span><span class="roi-neg">-$${timeAway.toLocaleString()}</span></div><div class="roi-row"><span>Retention value</span><span class="roi-pos">+$${retentionValue.toLocaleString()}</span></div><div class="roi-row"><span>Productivity gain</span><span class="roi-pos">+$${productivityValue.toLocaleString()}</span></div><div class="roi-row"><span>Net ROI</span><span style="color:${netROI>=0?'#0F6E56':'#791F1F'}">$${netROI.toLocaleString()}</span></div></div></div><div class="stats" style="margin-top:1rem"><div class="stat"><div class="sl">Cost per person</div><div class="sv">$${perHead.toLocaleString()}</div><div class="ss">total investment</div></div><div class="stat"><div class="sl">Breakeven</div><div class="sv">${breakeven} retained</div><div class="ss">employees</div></div><div class="stat"><div class="sl">Return multiple</div><div class="sv">${Math.max(0,(totalReturn/(cost+timeAway)).toFixed(1))}x</div><div class="ss">on spend</div></div><div class="stat"><div class="sl">Total upside</div><div class="sv">$${totalReturn.toLocaleString()}</div><div class="ss">retention + productivity</div></div></div>`;const out=document.getElementById('r-out');out.innerHTML=html;out.style.display='block';}
